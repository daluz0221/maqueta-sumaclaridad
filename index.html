<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Índice de maquetas · Jefes a Punto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Poppins:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main id="main">
    <section class="hero on-dark">
      <div class="hero__media" aria-hidden="true"></div>
      <div class="container" style="padding-block:40px 64px">
        <p class="eyebrow">Maqueta de interfaz · HTML</p>
        <h1 class="display display--l">Jefes a <span class="w600">Punto</span></h1>
        <p class="lead" style="margin-top:18px">Doce pantallas responsive, diseñadas en mobile (390) y adaptadas a tablet (768) y desktop (1280). Cada pantalla tiene una barra «Estado de maqueta» abajo a la izquierda para cambiar de estado.</p>
      </div>
    </section>
    <div class="tear" style="--from:var(--exhibicion);--to:var(--papel)" aria-hidden="true"></div>

    <section class="band band--tight band--papel" style="padding-bottom:96px">
      <div class="container">
        <ol class="idx-screens" id="screens"></ol>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var list = document.getElementById('screens');
      var widths = [['390', 'Mobile'], ['768', 'Tablet'], ['1280', 'Desktop']];
      list.innerHTML = window.JAP.SCREENS.map(function (s) {
        var states = s.states.map(function (st) {
          return '<a class="idx-chip" href="' + s.file + '?estado=' + st[0] + '">' + st[1] + '</a>';
        }).join('');
        var extra = (s.links || []).map(function (l) {
          return '<a class="idx-chip" href="' + s.file + l[0] + '">' + l[1] + '</a>';
        }).join('');
        var previews = widths.map(function (w) {
          return '<a class="idx-chip idx-chip--dev" href="preview.html?p=' + encodeURIComponent(s.file) + '&w=' + w[0] + '">' + w[1] + ' ' + w[0] + '</a>';
        }).join('');
        return '<li class="idx-screen">' +
          '<div class="idx-screen__head"><span class="idx-screen__num">' + s.n + '</span>' +
          '<div><h2 class="idx-screen__name"><a href="' + s.file + '">' + s.name + '</a></h2>' +
          '<p class="idx-screen__route" style="margin:0">' + s.route.replace(/</g, '&lt;') + '</p></div></div>' +
          '<div class="idx-links" aria-label="Estados">' + (states + extra || '<span class="meta">Un solo estado</span>') + '</div>' +
          '<div class="idx-links" aria-label="Vista por anchura">' + previews + '</div>' +
          '</li>';
      }).join('');
    });
  </script>
</body>
</html>
